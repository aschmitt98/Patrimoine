name: Cours du jour

# Euronext Paris clôture à 17h35 (heure de Paris). 17h40 UTC tombe après, été
# comme hiver. Les cryptos cotent en continu, mais la page les rafraîchit elle-même
# à chaque ouverture : ce travail ne sert qu'à garder un repli à jour.
on:
  schedule:
    - cron: "40 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cours
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cours.py n'utilise que la bibliothèque standard : rien à installer.
      - name: Relever les cours
        run: python3 scripts/cours.py

      - name: Committer si ça a bougé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cours.json
          if git diff --staged --quiet; then
            echo "Aucun changement de cours."
          else
            git commit -m "Cours du $(date -u +%d/%m/%Y)"
            git push
          fi
